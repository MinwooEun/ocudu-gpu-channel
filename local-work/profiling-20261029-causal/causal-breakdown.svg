<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="750" viewBox="0 0 1160 750"><rect width="1160" height="750" fill="#f6f8fc"/><style>text{font-family:sans-serif;fill:#182438}.h{font-size:25px;font-weight:bold}.s{font-size:17px}.n{font-size:14px}</style><text x="45" y="45" class="h">PR10 · Spark · CUDA gNB + CPU srsUE · 16 UE</text><text x="45" y="76" class="s">무선 1 ms당 누적 시간 — 최종 반복 계측. 한 번의 GPU 호출 시간이 아님.</text><rect x="45" y="105" width="622.4464557205496" height="45" fill="#5478d1"/><rect x="667.4464557205496" y="105" width="264.7593627360045" height="45" fill="#8658b9"/><rect x="932.2058184565541" y="105" width="71.6828339043942" height="45" fill="#4b9b86"/><rect x="1003.8886523609483" y="105" width="6.908257064960491" height="45" fill="#b8c1d1"/><text x="45" y="182" class="s">입력 1468 µs  +  출력 공간 624 µs  +  채널 169 µs  +  기타 = 2278 µs</text><text x="45" y="231" class="h">입력 대기 안에서 실제로 생긴 일</text><text x="45" y="278" class="s">UE 송신 준비 경계 이전</text><rect x="600" y="258" width="293.6413352591917" height="26" fill="#5478d1"/><text x="1005" y="278" class="s">452 µs</text><text x="45" y="325" class="s">send → broker receive (I/O·스케줄링 포함)</text><rect x="600" y="305" width="298.4607731376622" height="26" fill="#8658b9"/><text x="1005" y="325" class="s">459 µs</text><text x="45" y="372" class="s">입력 도착 후 producer가 확인할 때까지</text><rect x="600" y="352" width="351.3153196086565" height="26" fill="#c74456"/><text x="1005" y="372" class="s">540 µs</text><text x="45" y="424" class="h">CPU 실행 기록으로 확인한 대기</text><text x="45" y="459" class="s">producer 입력 대기 1468 µs 중 실제 CPU 사용 30 µs</text><text x="45" y="490" class="s">같은 producer의 4.03초 관측: CPU 실행 0.396초 / runnable 대기 3.604초</text><rect x="45" y="510" width="104.09925143088066" height="35" fill="#4b9b86"/><rect x="149.09925143088066" y="510" width="946.843838193938" height="35" fill="#c74456"/><rect x="1095.9430896248186" y="510" width="9.056910375181305" height="35" fill="#ccd3df"/><text x="45" y="582" class="s">51개 relay 작업자 + I/O·control 등이 broker의 두 CPU 코어를 공유한다.</text><text x="45" y="618" class="s">입력·출력 준비 뒤 내부 지연 약 1.15 ms. GPU 채널 계산만 봐서는 이 병목이 보이지 않았다.</text><text x="45" y="661" class="n">기준 0.446 / 0.448배. 알림 방식 probe는 개선 실패. 실시간 해결은 아직 검증되지 않았다.</text><text x="45" y="691" class="n">IQ 진행 분석과 UE별 KPI 유효성은 별도 판정이다. 상세 수치·제외 구간·원시 근거: report.ko.txt</text></svg>