# Set 1 (1-to-N): 1 gNB + 1 UEs, no UE-UE crosstalk. gNB has 1 incoming UL edges (fan-in choke point); each UE has 1 incoming DL edge.
runtime:
  backend: cuda
  gpu_device: 0
  batch_samples: 23040
  queue_samples: 2457600
devices:
  - id: gnb0
    role: gnb
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:5000
    rx_endpoint: tcp://*:5001
  - id: ue0
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:5100
    rx_endpoint: tcp://*:5101
links:
  - from: gnb0
    to: ue0
    model: cuda_mvp
  - from: ue0
    to: gnb0
    model: cuda_mvp
models:
  cuda_mvp:
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: -3.0
            phase_rad: 0.0
      - type: phase
        phase_rad: 0.125
      - type: cfo
        cfo_hz: 250
        phase_rad: 0
