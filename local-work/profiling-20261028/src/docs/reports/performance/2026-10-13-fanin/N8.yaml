# Set 1 (1-to-N): 1 gNB + 8 UEs, no UE-UE crosstalk. gNB has 8 incoming UL edges (fan-in choke point); each UE has 1 incoming DL edge.
runtime:
  backend: cuda
  gpu_device: 0
  batch_samples: 23040
  queue_samples: 2457600
devices:
  - id: gnb0
    role: gnb
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:5000
    rx_endpoint: tcp://*:5001
  - id: ue0
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:5100
    rx_endpoint: tcp://*:5101
  - id: ue1
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:5102
    rx_endpoint: tcp://*:5103
  - id: ue2
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:5104
    rx_endpoint: tcp://*:5105
  - id: ue3
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:5106
    rx_endpoint: tcp://*:5107
  - id: ue4
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:5108
    rx_endpoint: tcp://*:5109
  - id: ue5
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:5110
    rx_endpoint: tcp://*:5111
  - id: ue6
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:5112
    rx_endpoint: tcp://*:5113
  - id: ue7
    role: ue
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:5114
    rx_endpoint: tcp://*:5115
links:
  - from: gnb0
    to: ue0
    model: cuda_mvp
  - from: ue0
    to: gnb0
    model: cuda_mvp
  - from: gnb0
    to: ue1
    model: cuda_mvp
  - from: ue1
    to: gnb0
    model: cuda_mvp
  - from: gnb0
    to: ue2
    model: cuda_mvp
  - from: ue2
    to: gnb0
    model: cuda_mvp
  - from: gnb0
    to: ue3
    model: cuda_mvp
  - from: ue3
    to: gnb0
    model: cuda_mvp
  - from: gnb0
    to: ue4
    model: cuda_mvp
  - from: ue4
    to: gnb0
    model: cuda_mvp
  - from: gnb0
    to: ue5
    model: cuda_mvp
  - from: ue5
    to: gnb0
    model: cuda_mvp
  - from: gnb0
    to: ue6
    model: cuda_mvp
  - from: ue6
    to: gnb0
    model: cuda_mvp
  - from: gnb0
    to: ue7
    model: cuda_mvp
  - from: ue7
    to: gnb0
    model: cuda_mvp
models:
  cuda_mvp:
    chain:
      - type: tdl
        taps:
          - delay_samples: 0.0
            gain_db: -3.0
            phase_rad: 0.0
      - type: phase
        phase_rad: 0.125
      - type: cfo
        cfo_hz: 250
        phase_rad: 0
