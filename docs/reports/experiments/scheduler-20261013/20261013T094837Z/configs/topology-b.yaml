    tx_endpoint: tcp://127.0.0.1:2107
    rx_endpoint: tcp://127.0.0.1:2106
    tx_carrier: n3-ul
    rx_carrier: n3-dl
    rx_model: rx_noise_ue3
radio_nodes:
