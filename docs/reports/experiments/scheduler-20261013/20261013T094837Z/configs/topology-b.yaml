      - gnb1_p0
    rx_ports:
      - gnb1_p0
  - id: ue2
    tx_ports:
      - ue2_p0
    rx_ports:
      - ue2_p0
  - id: ue3
    tx_ports:
      - ue3_p0
    rx_ports:
