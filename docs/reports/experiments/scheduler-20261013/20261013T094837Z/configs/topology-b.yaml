    rx_carrier: n3-ul
    rx_model: rx_noise_gnb1
  - id: ue2_p0
    role: port
    sample_rate_hz: 23040000
    tx_endpoint: tcp://127.0.0.1:2105
    rx_endpoint: tcp://127.0.0.1:2104
